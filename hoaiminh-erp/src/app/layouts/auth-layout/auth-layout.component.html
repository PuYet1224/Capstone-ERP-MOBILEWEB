<div class="auth-layout" [style.backgroundImage]="'url(' + carouselActive + ')'">
    <div class="layout-overlay"></div>
    <div class="layout-main">
        <div class="main-left owl-carousel owl-theme">
            <div class="item" *ngFor="let item of carouselData">
                <img [src]="item" alt="Image">
            </div>
        </div>
        <div class="main-right">
            <div class="right-form" *ngIf="tabActive ==1">
                <div class="form-header">
                    <img src="../../../assets/images/logos/hoaiminh-logo.png" alt="">
                </div>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    <kendo-textbox #username name="username" showErrorIcon="initial" placeholder="Tài khoản"
                                   formControlName="username" required></kendo-textbox>
                    <kendo-textbox #password name="password" showErrorIcon="initial" placeholder="Mật khẩu"
                                   formControlName="password" type="password" class="mt-3" required>
                        <ng-template kendoTextBoxSuffixTemplate>
                            <button kendoButton type="button" look="clear" icon="eye" (mousedown)="showpassword()"
                                    (mouseup)="hidepassword()" (mouseleave)="hidepassword()"></button>
                        </ng-template>
                    </kendo-textbox>
                    <ps-kendo-button [theme]="'primary'">đăng nhập</ps-kendo-button>
                </form>
                <div class="right-copyright mulish w-600">
                    © 2025&nbsp;
                    <a href="" class="mulish w-600">
                        <span class="mulish w-600">3P</span>&nbsp;<span class="mulish w-600">Solutions</span>&nbsp;Ltd.
                        Co.
                    </a>
                </div>
            </div>
            <div class="select-head" *ngIf="tabActive ==2">
                <div class="popup-header">
                    danh sách head
                </div>
                <div class="popup-content">
                    <div class="content-item" (click)="selectHead(itemhead)"
                         *ngFor="let itemhead of listHead, let i = index">
                        <div class="item-image">
                            <img src="../../../../../assets/images/logos/hoaiminh-logo.png" alt="">
                        </div>
                        <div class="item-context">
                            <div class="context-name playfair-display" style="color: #e5322b;">
                                {{itemhead.HeadName}}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popup-sub">
                    Chọn 01 head
                    <div>
                        &nbsp;(bắt buộc)
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
