<div class="mtb035-document-receipt-update premium-receipt">
    <!-- START: HEADER -->
    <ps-header-back (clickBack)="goBack()">
        <div class="header-content">
            <div>
                <div class=" func-title1">THANH TOÁN BÁN HÀNG</div>
                <div class="func-title2">Thông tin phiếu thu</div>
            </div>
            <div class="header-right">
                <div class="receipt-code">{{ receipt.ReceiptNo || 'HM0000005/PT1' }}</div>
                <div class="receipt-date">{{ receipt.CreatedTime | date:'dd/MM/yyyy HH:mm' }}</div>
            </div>
        </div>
    </ps-header-back>
    <!-- END: HEADER -->

    <main class="content-scrollable">
        <!-- Khách hàng Card -->
        <div class="form-card">
            <div class="card-header">
                <h3 class="card-title">Khách hàng</h3>
            </div>
            <div class="card-body">
                <div class="form-group custom-label-wrapper" [ngClass]="{'has-error': errors.CustomerName}">
                    <ps-kendo-textbox label="Khách hàng (*)" placeholder="Nhập tên khách hàng"
                        [(ngModel)]="receipt.CustomerName" (blur)="onBlur()">
                    </ps-kendo-textbox>
                </div>

                <div class="form-group">
                    <ps-kendo-textbox label="Số điện thoại" placeholder="Nhập số điện thoại"
                        [(ngModel)]="receipt.CellPhone" (blur)="onBlur()">
                    </ps-kendo-textbox>
                </div>

                <div class="form-group">
                    <ps-kendo-dropdown-list label="Tỉnh thành" [data]="listProvince" 
                        textField="VNProvince" valueField="Code" [valuePrimitive]="true"
                        [(ngModel)]="currentProvinceCode" (valueChange)="onProvinceChange($event)">
                    </ps-kendo-dropdown-list>
                </div>

                <div class="form-group">
                    <ps-kendo-dropdown-list label="Phường xã" [data]="listWard" 
                        textField="VNWard" valueField="Code" [valuePrimitive]="true"
                        [(ngModel)]="currentWardCode" (valueChange)="onWardChange($event)"
                        placeholder="Chọn phường xã">
                    </ps-kendo-dropdown-list>
                </div>

                <div class="form-group">
                    <ps-kendo-textarea label="Địa chỉ" placeholder="Nhập địa chỉ" [(ngModel)]="receipt.Address"
                        (blur)="onBlur()">
                    </ps-kendo-textarea>
                </div>
            </div>
        </div>

        <!-- Thanh toán Card -->
        <div class="form-card">
            <div class="card-header">
                <h3 class="card-title">Thanh toán</h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <ps-kendo-dropdown-list label="Phương thức thanh toán (*)" [data]="listPaymentMethods"
                        textField="Name" valueField="TypeOfList" [valuePrimitive]="true"
                        [(ngModel)]="receipt.PaymentMethod" (valueChange)="onPaymentMethodChange($event)">
                    </ps-kendo-dropdown-list>
                </div>

                <!-- Tiền mặt Amount -->
                <ng-container *ngIf="receipt.PaymentMethod === 1 || receipt.PaymentMethod === 3">
                    <div class="form-group split-amount">
                        <label class="k-label">Số tiền mặt</label>
                        <div class="amount-input-wrapper">
                            <ps-kendo-numeric-textbox [spinners]="false" format="n0" placeholder="0"
                                [(ngModel)]="receipt.CashAmount" (valueChange)="onCashAmountChange($event)"
                                (blur)="onBlur()">
                            </ps-kendo-numeric-textbox>
                            <span class="amount-postfix">{{ receipt.CollectedAmount | number:'1.0-0' }}đ</span>
                        </div>
                    </div>
                </ng-container>

                <!-- Chuyển khoản details & Amount -->
                <ng-container *ngIf="receipt.PaymentMethod === 2 || receipt.PaymentMethod === 3">
                    <div class="form-group split-amount">
                        <label class="k-label">Số tiền chuyển khoản</label>
                        <div class="amount-input-wrapper">
                            <ps-kendo-numeric-textbox [spinners]="false" format="n0"
                                [readonly]="receipt.PaymentMethod === 3" [(ngModel)]="receipt.TransferAmount"
                                [class.readonly-input]="receipt.PaymentMethod === 3" (blur)="onBlur()">
                            </ps-kendo-numeric-textbox>
                            <span class="amount-postfix">{{ receipt.CollectedAmount | number:'1.0-0' }}đ</span>
                        </div>
                    </div>
                </ng-container>

                <div class="form-group">
                    <ps-kendo-textarea label="Mô tả" placeholder="Nhập mô tả" [(ngModel)]="receipt.Description"
                        (blur)="onBlur()">
                    </ps-kendo-textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER ACTIONS -->
    <div class="footer-actions">
        <button class="btn-back" (click)="goBack()">
            <span class="material-icons">arrow_back</span>
        </button>
        <button class="btn-save" (click)="onSave()">Lưu thay đổi</button>
    </div>
</div>
