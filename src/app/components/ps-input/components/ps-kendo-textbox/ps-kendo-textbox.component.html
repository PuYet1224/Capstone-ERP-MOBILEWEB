<div class="kendo-textbox">
  <kendo-label *ngIf="label != ''" class="k-display-block" [for]="textbox" text="{{label}}"></kendo-label>
  <kendo-textbox #textbox (keydown.Enter)="onKeydownEnter()" (valueChange)="onValueChange()"
                 placeholder="{{placeholder}}" (blur)="onBlur()" (focus)="onFocus()" (valueChange)="onChange($event)"
                 [(ngModel)]="value" [disabled]="disabled" [style.width.px]="width"
                 [ngClass]="{'hasPrefix': hasPrefix}">
    <ng-template kendoTextBoxPrefixTemplate *ngIf="hasPrefix">
      <ng-content select="[kendoTextBoxPrefixTemplate]"></ng-content>
    </ng-template>
  </kendo-textbox>
</div>
